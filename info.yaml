# Tiny Tapeout project information
project:
  title:             "2x2 INT8 Matrix Multiplier"
  author:            "Rozan Tariq"
  discord:           " "
  description:       "C = A x B for 2x2 signed 8-bit matrices, one shared multiplier"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_matmul2x2_int8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "RES0"
  uo[1]: "RES1"
  uo[2]: "RES2"
  uo[3]: "RES3"
  uo[4]: "RES4"
  uo[5]: "RES5"
  uo[6]: "RES6"
  uo[7]: "RES7"

  # Bidirectional pins
  uio[0]: "WR in"
  uio[1]: "START in"
  uio[2]: "SEL0 in"
  uio[3]: "SEL1 in"
  uio[4]: "HI in"
  uio[5]: "DONE out"
  uio[6]: "BUSY out"
  uio[7]: "RES16 out"

# Do not change!
yaml_version: 6
